      <h1 style="font-size:24px;font-weight:900;margin:0 0 6px 0;letter-spacing:-0.5px;color:#ffffff;text-shadow:0 2px 8px rgba(0,0,0,0.2);">TwingHisabi – সহজ হিসাব ও ব্যবসা ব্যবস্থাপনা</h1>
      <p style="font-size:13px;color:#a7f3d0;margin:0 0 22px 0;font-weight:600;opacity:0.95;">TwingHisabi হলো সহজ ও আধুনিক হিসাব এবং ব্যবসা ব্যবস্থাপনার প্ল্যাটফর্ম।</p>

      <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);padding:9px 20px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(4px);">
        <div style="width:17px;height:17px;border:2.5px solid #34d399;border-top-color:transparent;border-radius:50%;animation:twing-spin 0.75s linear infinite;"></div>
        <span id="loader-status-text" style="font-size:12px;color:#f8fafc;font-weight:700;">খাতা প্রস্তুত করা হচ্ছে...</span>
      </div>

      <div id="loader-error-details" style="display:none;margin-top:14px;background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);border-radius:10px;padding:8px 14px;color:#fca5a5;font-size:11px;max-width:320px;text-align:center;word-break:break-word;"></div>

      <div id="loader-fallback-actions" style="display:none;margin-top:24px;text-align:center;max-width:340px;animation:twing-fade 0.3s ease-out;">
        <p style="font-size:13px;color:#fecaca;margin:0 0 14px 0;line-height:1.5;">সংযোগ ধীরগতির হলে অথবা অ্যাপ লোড হতে সময় নিলে:</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button id="tv-loader-reload-btn" type="button" tabindex="0" onclick="window.location.reload()" style="background:#10b981;color:#022c22;border:none;min-height:44px;padding:10px 22px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;outline:none;box-shadow:0 4px 12px rgba(16,185,129,0.3);">রিলোড করুন</button>
          <button type="button" tabindex="0" onclick="(function(){try{localStorage.removeItem('twing_temp_cache');if('caches' in window){caches.keys().then(function(k){k.forEach(function(x){caches.delete(x);});});}}catch(e){}window.location.reload();})()" style="background:rgba(255,255,255,0.18);color:#ffffff;border:1px solid rgba(255,255,255,0.3);min-height:44px;padding:10px 22px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;outline:none;">ক্যাশ ক্লিয়ার</button>
        </div>
      </div>
    </div>
    <style>
      @keyframes twing-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes twing-fade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes twing-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes twing-pulse-expand {
        0% { transform: scale(0.85); opacity: 0.8; }
        50% { transform: scale(1.35); opacity: 0.2; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      .twing-loader-pulse-ring {
        position: absolute;
        inset: -6px;
        border-radius: 28px;
        background: radial-gradient(circle, rgba(16,185,129,0.5) 0%, rgba(13,148,136,0) 70%);
        animation: twing-pulse-expand 2.4s ease-out infinite;
        pointer-events: none;
      }
      #tv-loader-reload-btn:focus {
        outline: 3px solid #34d399 !important;
        outline-offset: 3px !important;
        transform: scale(1.05);
      }
    </style>
    <script>
      var twingLoaderSeconds = 0;
      var loaderTextElem = document.getElementById('loader-status-text');
      var twingLoaderInterval = setInterval(function() {
        twingLoaderSeconds++;
        if (twingLoaderSeconds === 4 && loaderTextElem) {
          loaderTextElem.innerText = 'তথ্য লোড ও সিঙ্ক হচ্ছে...';
        } else if (twingLoaderSeconds === 9 && loaderTextElem) {
          loaderTextElem.innerText = 'সিস্টেম সংযোগ স্থাপন হচ্ছে...';
        } else if (twingLoaderSeconds === 15 && loaderTextElem) {
          loaderTextElem.innerText = 'অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন...';
        }
      }, 1000);

      // Dismiss pre-loader cleanly once React mounts
      window.__TWING_LOADER_DONE__ = function() {
        clearInterval(twingLoaderInterval);
        if (window.__twingFallbackTimeout) clearTimeout(window.__twingFallbackTimeout);
        var instantLoader = document.getElementById('app-instant-loader');
        if (instantLoader) {
          instantLoader.style.transition = 'opacity 0.35s ease-out';
          instantLoader.style.opacity = '0';
          instantLoader.style.pointerEvents = 'none';
          setTimeout(function() {
            try { instantLoader.remove(); } catch(e) {}
          }, 380);
        }
      };

      // Show fallback action only if genuinely not mounted within 18 seconds
      window.__twingFallbackTimeout = setTimeout(function() {
        clearInterval(twingLoaderInterval);
        var fb = document.getElementById('loader-fallback-actions');
        if (fb) {
          fb.style.display = 'block';
        }
      }, 18000);

      // Catch unhandled script errors during initial boot and display helpful diagnostics
      window.addEventListener('error', function(err) {
        var errBox = document.getElementById('loader-error-details');
        if (errBox && err && err.message) {
          errBox.innerText = 'সিস্টেম বার্তা: ' + String(err.message).slice(0, 100);
          errBox.style.display = 'block';
        }
        if (twingLoaderSeconds >= 6) {
          var fb = document.getElementById('loader-fallback-actions');
          if (fb) fb.style.display = 'block';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
