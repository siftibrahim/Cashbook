    <!-- Universal Polyfills for Smart TV (Samsung Tizen, LG webOS, Android TV) & Legacy Browsers -->
    <script>
      (function installSmartTvPolyfills() {
        // 1. globalThis polyfill
        if (typeof globalThis === 'undefined') {
          try {
            Object.defineProperty(Object.prototype, '__magic__', {
              get: function () { return this; },
              configurable: true,
            });
            __magic__.globalThis = __magic__;
            delete Object.prototype.__magic__;
          } catch (e) {
            window.globalThis = window;
          }
        }

        // 2. String.prototype.replaceAll
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function (search, replacement) {
            if (search instanceof RegExp) {
              return this.replace(search, replacement);
            }
            return this.split(search).join(replacement);
          };
        }

        // 3. Array.prototype.at
        if (!Array.prototype.at) {
          Array.prototype.at = function (n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this[n];
          };
        }

        // 4. Object.hasOwn
        if (!Object.hasOwn) {
          Object.hasOwn = function (obj, prop) {
            return Object.prototype.hasOwnProperty.call(obj, prop);
          };
        }

        // 5. Promise.allSettled
        if (!Promise.allSettled) {
          Promise.allSettled = function (promises) {
            return Promise.all(
              Array.from(promises).map(function (p) {
                return Promise.resolve(p).then(
                  function (value) { return { status: 'fulfilled', value: value }; },
                  function (reason) { return { status: 'rejected', reason: reason }; }
                );
              })
            );
          };
        }

        // 6. Safe localStorage protection for Smart TV private browsing
        try {
          var test = '__twing_tv_test__';
          window.localStorage.setItem(test, test);
          window.localStorage.removeItem(test);
        } catch (e) {
          var memStore = {};
          try {
            Object.defineProperty(window, 'localStorage', {
              value: {
                getItem: function (k) { return memStore[k] || null; },
                setItem: function (k, v) { memStore[k] = String(v); },
                removeItem: function (k) { delete memStore[k]; },
                clear: function () { memStore = {}; },
                key: function (i) { return Object.keys(memStore)[i] || null; },
                get length() { return Object.keys(memStore).length; }
              },
              writable: true,
              configurable: true
            });
          } catch (ex) {}
        }
      })();
    </script>

    <style>
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: 'Hind Siliguri', system-ui, -apple-system, sans-serif;
        background-color: #002820;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {

      }

      /* Clean Native Print Media Rules */
      @media print {
        body {
          background: white !important;

        .no-print {

        #modal-report > div {
          max-height: none !important;

    <script>
      // Gracefully prevent benign ResizeObserver notifications while preserving real script diagnostics
      window.addEventListener('error', function (e) {
        if (e && typeof e.message === 'string' && e.message.includes('ResizeObserver loop')) {
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      });

      // Cleanup stale service workers if running inside an iframe preview or on development host
      (function cleanStaleSW() {
        try {
          var isIframe = window.self !== window.top;
          var isDevHost = window.location.hostname.includes('localhost') || 
                          window.location.hostname.includes('.run.app') ||
                          window.location.port === '3000';
          if ((isIframe || isDevHost) && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-100 text-slate-800 antialiased">
    <div id="root">
      <!-- Instant pre-loader shown immediately while scripts parse & React mounts -->
      <div id="app-instant-loader" style="position:fixed;inset:0;background:#002820;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;color:#ffffff;padding:24px;z-index:999999;">
        <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#10b981,#0d9488);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(0,0,0,0.35);margin-bottom:18px;border:2px solid rgba(255,255,255,0.2);">
          <svg style="width:38px;height:38px;fill:none;stroke:#ffffff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24">
            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/>
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/>
            <path d="M2 7h20"/>
            <path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/>
          </svg>
        </div>
        <h1 style="font-size:24px;font-weight:900;margin:0 0 6px 0;letter-spacing:-0.5px;color:#ffffff;text-shadow:0 2px 8px rgba(0,0,0,0.2);">TWING হিসাবি</h1>
        <p style="font-size:13px;color:#a7f3d0;margin:0 0 22px 0;font-weight:600;opacity:0.95;">ডিজিটাল খাতা ও সুপার শপ ম্যানেজমেন্ট</p>

        <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);padding:9px 20px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(4px);">
          <div style="width:17px;height:17px;border:2.5px solid #34d399;border-top-color:transparent;border-radius:50%;animation:twing-spin 0.75s linear infinite;"></div>
          <span style="font-size:12px;color:#f8fafc;font-weight:700;">খাতা প্রস্তুত করা হচ্ছে...</span>
        </div>

        <div id="loader-fallback-actions" style="display:none;margin-top:28px;text-align:center;max-width:340px;animation:twing-fade 0.3s ease-out;">
          <p style="font-size:13px;color:#fecaca;margin:0 0 14px 0;line-height:1.5;">অ্যাপ খুলতে দেরি হলে বা কোনো সমস্যা হলে:</p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button id="tv-loader-reload-btn" type="button" tabindex="0" onclick="window.location.reload()" style="background:#10b981;color:#022c22;border:none;min-height:46px;padding:10px 22px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;outline:none;box-shadow:0 4px 12px rgba(16,185,129,0.3);">রিলোড করুন (OK)</button>
            <button type="button" tabindex="0" onclick="(function(){try{localStorage.removeItem('twing_temp_cache');if('caches' in window){caches.keys().then(function(k){k.forEach(function(x){caches.delete(x);});});}}catch(e){}window.location.reload();})()" style="background:rgba(255,255,255,0.18);color:#ffffff;border:1px solid rgba(255,255,255,0.3);min-height:46px;padding:10px 22px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;outline:none;">ক্যাশ ক্লিয়ার</button>
          </div>
        </div>
      </div>
      <style>
        @keyframes twing-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes twing-fade {
          from { opacity: 0; transform: translateY(6px); }
          to { opacity: 1; transform: translateY(0); }
        }
        #tv-loader-reload-btn:focus {
          outline: 3px solid #34d399 !important;
          outline-offset: 3px !important;
          transform: scale(1.05);
        }
      </style>
      <script>
        // Show fallback reload action if React doesn't mount within 3.5 seconds
        setTimeout(function() {
          var fb = document.getElementById('loader-fallback-actions');
          if (fb && fb.style.display !== 'block') {
            fb.style.display = 'block';
            var btn = document.getElementById('tv-loader-reload-btn');
            if (btn) btn.focus();
          }
        }, 3500);

        // Catch unhandled script errors during initial boot and display fallback immediately
        window.addEventListener('error', function(err) {
          var fb = document.getElementById('loader-fallback-actions');
          if (fb) {
            fb.style.display = 'block';
            var btn = document.getElementById('tv-loader-reload-btn');
            if (btn) btn.focus();
          }
        });
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
